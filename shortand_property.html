<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background: salmon url('giphy.gif') right top fixed no-repeat;
        }
        h1, p {
            color: aquamarine;
        }
        button {
            color: white;
            background-color: rgb(37, 181, 18);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(30, 150, 15);
        }
    </style>
    <title>Open Google</title>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <p>This is a simple HTML page with a button to open Google.</p>
    <p>Here is another paragraph with more information.</p>
    <p>Feel free to explore and click the button to visit Google.</p>
    <button onclick="window.location.href='https://www.google.com'">Go to Google</button>
</body>
</html>
