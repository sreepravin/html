<!DOCTYPE html>
<html>
    <head>
        <title>Change Sum</title>
    </head>
    <body>
        <form>
            <label for="f1">Number 1:</label>
            <input type="number" id="f1" name="f1"><br><br>
            <label for="f2">Number 2:</label>
            <input type="number" id="f2" name="f2"><br><br>
        </form>
        <h1 id="sum1">Sum of two numbers</h1>
        <button type="button" onclick="sum()">Sum!</button>
        <script>
            function sum() {
                var n1 = parseInt(document.getElementById("f1").value) || 0;
                var n2 = parseInt(document.getElementById("f2").value) || 0;
                var sum2 = n1 + n2;
                document.getElementById("sum1").innerHTML = "Sum of two numbers is: " + sum2;
            }
        </script>
    </body>
</html>
