<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia&effect=fire|outline|shadow-multiple|emboss|glow-text" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        h1 {
            color: red;
            font-family: 'sofia', sans-serif;
        }
        h2 {
            font-family: 'trirong', serif;
            font-size: 30px;
            text-shadow: 2px 2px 4px #5f0606;
            color: blue;
        }
        h3 {
            font-family: 'audiowide', cursive;
            color: green;
        }
        p {
            color: black;
        }
    </style>
    <title>Basic HTML Structure</title>
</head>
<body>
    <h1 class="font-effect-fire"><i class="material-icons">computer</i> is an computer Heading</h1>
    <h2 class="font-effect-emboss"><i class="material-icons">traffic</i>This is an H2 Heading</h2>
    <h3>This is an H3 Heading</h3>
    <p class="font-effect-outline">This is the first paragraph.</p>
    <p class="font-effect-shadow-multiple">This is the second paragraph.</p>
    <p class="font-effect-glow-text">This is the third paragraph.</p>
    <p>This is the fourth paragraph.</p>
    <p>This is the fifth paragraph.</p>
</body>
</html>
