<html>
    <head>
        <style>
            body{
                background-color: brown;
            }
            p{
                background-color: aqua;
                font-family: Verdana;
                border: 2px salmon;
                padding: 30px;
                font-size: larger;

            }
            h1{
                background-color: blue;
                font-family: Impact;
                font-size: x-large;
                border: 2px seashell;
                padding: 30px;
            }
        </style>
    </head>
    <body>
        <h1 style="background-color: blueviolet;">The CSS color property defines the text color to be used.</h1>
        <p>The CSS color property defines the text color to be used.

            The CSS font-family property defines the font to be used.
            
            The CSS font-size property defines the text size to be used.</p>
    </body>
</html>
