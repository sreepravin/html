<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .calculator-container h2 {
            margin-bottom: 20px;
        }
        .calculator-container input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .calculator-container input[type="button"] {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
        }
        .calculator-container input[type="button"]:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .result {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h2>Salary Calculator</h2>
        <form id="salaryForm">
            <label for="hourlyWage">Hourly Wage</label>
            <input type="text" id="hourlyWage" name="hourlyWage" required>
            <label for="hoursWorked">Hours Worked</label>
            <input type="text" id="hoursWorked" name="hoursWorked" required>
            <input type="button" value="Calculate" onclick="calculateSalary()">
        </form>
        <div class="error" id="error"></div>
        <div class="result" id="result"></div>
    </div>

    <script>
        function calculateSalary() {
            const hourlyWage = document.getElementById('hourlyWage').value;
            const hoursWorked = document.getElementById('hoursWorked').value;
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            errorDiv.textContent = '';
            resultDiv.textContent = '';

            if (isNaN(hourlyWage) || isNaN(hoursWorked)) {
                errorDiv.textContent = 'Please enter valid numeric values.';
                return;
            }

            if (hourlyWage < 0 || hoursWorked < 0) {
                errorDiv.textContent = 'Please enter positive values.';
                return;
            }

            const totalSalary = hourlyWage * hoursWorked;
            resultDiv.textContent = `Total Salary: $${totalSalary.toFixed(2)}`;
        }
    </script>
</body>
</html>
