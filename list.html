<htnl>
    <head>
        <title>css List property</title>
        <style>
            ul{
                list-style-type: square;
                background-color: rgb(226, 10, 226);
                padding: 20px;
                margin: 20px;
                border: 5px solid rgb(235, 113, 188);
            }
            ol{
                background-color: rgb(154, 154, 19);
                padding: 20px;
                margin: 20px;
                border: 5px solid rgb(236, 232, 8);
            }
            ul li{
                background-color: rgb(212, 186, 212);
                color: rgb(241, 1, 165);
                margin: 5px;
            }
            ol li{
                background-color: rgb(124, 133, 77);
                color: rgb(241, 241, 1);
                padding: 5px;
                margin-left: 35px;
            }
            h1{
                color: rgb(241, 1, 165);
                text-shadow: 0px 0px 3px rgb(15, 14, 15), 0px 0px 5px rgb(222, 28, 225), 0px 0px 5px rgb(241, 1, 165);
            }
        </style>
    <head>
    <body>
        <h1>css List property</h1>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>PHP</li>
            <li>Python</li>
        </ul>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>PHP</li>
            <li>Python</li>
        </ol>
    </body>

</htnl>
